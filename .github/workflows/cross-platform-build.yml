name: Cross-platform build

on:
  push:
    branches: [ main, "feature/**", "cross-platform/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  core-smoke-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project src/CodyFormat.SmokeTests/CodyFormat.SmokeTests.csproj -c Release

  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: windows-latest
            rid: win-arm64
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-latest
            rid: linux-arm64
          - os: macos-latest
            rid: osx-arm64
          - os: macos-latest
            rid: osx-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish ${{ matrix.rid }}
        shell: bash
        run: dotnet publish src/CodyFormat.Desktop/CodyFormat.Desktop.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:UseAppHost=true -o artifacts/${{ matrix.rid }}
      - name: Add Linux desktop integration
        if: startsWith(matrix.rid, 'linux-')
        shell: bash
        run: |
          cp packaging/linux/install-user.sh artifacts/${{ matrix.rid }}/install-user.sh
          cp packaging/linux/uninstall-user.sh artifacts/${{ matrix.rid }}/uninstall-user.sh
          chmod +x artifacts/${{ matrix.rid }}/CodyFormat artifacts/${{ matrix.rid }}/install-user.sh artifacts/${{ matrix.rid }}/uninstall-user.sh
          mkdir -p artifacts/${{ matrix.rid }}/desktop-integration
          cp packaging/linux/codyformat.desktop artifacts/${{ matrix.rid }}/desktop-integration/codyformat.desktop
          cp -a packaging/linux/icons artifacts/${{ matrix.rid }}/desktop-integration/
          cp -a packaging/linux/pixmaps artifacts/${{ matrix.rid }}/desktop-integration/
      - uses: actions/upload-artifact@v4
        with:
          name: CodyFormat-${{ matrix.rid }}
          path: artifacts/${{ matrix.rid }}
